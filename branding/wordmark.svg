<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2480 1024" width="2480" height="1024">
<g>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3fd9"/>
      <stop offset="1" stop-color="#2a1a7a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ecebf7"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#12082f" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- section tabs peeking out on the right of the page -->
  <g filter="url(#sh)">
    <rect x="640" y="250" width="170" height="112" rx="26" fill="#e8483a"/>
    <rect x="640" y="388" width="150" height="112" rx="26" fill="#2bb39a"/>
    <rect x="640" y="526" width="130" height="112" rx="26" fill="#5aa9f0"/>
    <!-- page with folded corner -->
    <path d="M250 200 H600 L700 300 V800 a40 40 0 0 1 -40 40 H250 a40 40 0 0 1 -40 -40 V240 a40 40 0 0 1 40 -40 z" fill="url(#page)"/>
  </g>
  <path d="M600 200 V260 a40 40 0 0 0 40 40 H700 z" fill="#c9c5ea"/>
  <!-- the Z -->
  <path d="M300 330 H590 V400 L410 640 H600 V710 H290 V640 L470 400 H300 z" fill="#3b26a8"/>
  <!-- a little ruled line under the Z, like a note -->
  <rect x="300" y="752" width="220" height="22" rx="11" fill="#c9c5ea"/>
</g>
<text x="1040" y="640" font-family="Inter, 'DejaVu Sans', sans-serif" font-weight="800" font-size="330" letter-spacing="-6" fill="#2a1a7a">Zor<tspan fill="#5b3fd9">Note</tspan></text>
</svg>