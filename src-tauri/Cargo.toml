[package]
name = "zornote"
version = "0.4.9"
description = "OneNote-style notebook app for Linux"
license = "MIT"
repository = "https://github.com/solomwn/zornote"
edition = "2021"

[lib]
name = "zornote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# PDF export: print the page straight to a PDF file with WebKitGTK's print operation (same versions as Tauri uses)
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
gtk = "0.18"
