# Build the .deb and publish a GitHub release for the version in package.json.
# Runs when the version changes on main (or by hand from the Actions tab); the tag vX.Y.Z is created by the release.
name: Release

on:
  push:
    branches: [main]
    paths: ["package.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists – nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: System libraries
        if: steps.ver.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.ver.outputs.skip != 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.ver.outputs.skip != 'true'
        with:
          workspaces: src-tauri

      - name: Build .deb
        if: steps.ver.outputs.skip != 'true'
        run: |
          npm ci
          npm run tauri build -- --bundles deb

      - name: Release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ZorNote ${{ steps.ver.outputs.version }}
          files: src-tauri/target/release/bundle/deb/*.deb
          body: |
            **Install:** download `ZorNote_${{ steps.ver.outputs.version }}_amd64.deb` below, then
            ```bash
            cd ~/Downloads
            sudo apt install ./ZorNote_${{ steps.ver.outputs.version }}_amd64.deb
            ```
            What's new: see [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
